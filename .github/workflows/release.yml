name: Release

on:
  push:
    tags: ["v*"]
  # Manual entrance: cut a release without pushing a tag locally. The tag is
  # created by the release step at the dispatched ref. Useful when a tag push
  # isn't possible (restricted client) or to re-cut a failed release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release (e.g. v0.4.11)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # The Go bridge is pure Go (modernc.org/sqlite, CGO disabled), so every
  # target cross-compiles from a single runner — no per-OS matrix needed.
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go-bridge/go.sum

      - run: npm ci

      # 1. Bundle the TS/MCP layer (index.js + sql-wasm.wasm), no Go build.
      - run: npm run build:ts

      # 2. Cross-compile the bridge for every supported target into dist/.
      - name: Build bridge binaries (all platforms)
        working-directory: go-bridge
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          build() {
            local goos=$1 goarch=$2 ext=${3:-}
            echo "Building $goos/$goarch..."
            GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags="-s -w" \
              -o "../dist/hermeneia-bridge-${goos}-${goarch}${ext}" .
          }
          build darwin  arm64
          build darwin  amd64
          build linux   amd64
          build linux   arm64
          build windows amd64 .exe
          ls -la ../dist/

      # 3. Pack the .mcpb — .mcpbignore trims it to darwin-arm64 + windows-amd64,
      #    the two platforms Claude Desktop runs on.
      # `mcpb pack` defaults to writing <name>.mcpb in the CURRENT directory,
      # so the release step's dist/hermeneia.mcpb glob never matched and the
      # bundle was silently absent from the release. Name the output path
      # explicitly instead of relying on the default.
      - run: npx @anthropic-ai/mcpb pack . dist/hermeneia.mcpb
      - run: npx @anthropic-ai/mcpb validate dist/hermeneia.mcpb || true

      # 4. Tar the standalone bridge binaries for non-mcpb users
      #    (Refugio / Linux / Intel-mac / build-from-source).
      - name: Tar standalone bridge binaries
        run: |
          cd dist
          for f in hermeneia-bridge-*; do
            [ -e "$f" ] || continue
            case "$f" in *.tar.gz) continue;; esac
            # Strip the Windows .exe suffix from the ARCHIVE name so every
            # platform's asset is hermeneia-bridge-<os>-<arch>.tar.gz — the
            # exact name Refugio's installer requests. The binary inside
            # keeps its .exe extension.
            tar czf "${f%.exe}.tar.gz" "$f"
          done
          ls -la *.tar.gz

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push, github.ref_name IS the tag. On workflow_dispatch,
          # inputs.tag names the tag to create at the dispatched commit.
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/hermeneia.mcpb
            dist/hermeneia-bridge-*.tar.gz
          generate_release_notes: true
