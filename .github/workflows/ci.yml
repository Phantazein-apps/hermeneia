name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx tsc --noEmit

  # Cross-platform smoke test of the TS/store layer. Demo mode replays
  # bundled fixtures through the real store and every MCP tool, so this runs
  # on all three OSes with no Go toolchain and no WhatsApp account.
  demo-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run test:demo
